<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temporizador</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    .container { display: flex; height: 100vh; }
    .panel { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .edit-button { position: absolute; top: 10px; right: 10px; z-index: 10; }
    .modal { display: none; position: fixed; z-index: 20; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; width: 90%; max-width: 600px; height: 80vh; overflow-y: auto; }
    .tabs { display: flex; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
    .tab { padding: 10px; cursor: pointer; }
    .tab.active { font-weight: bold; border-bottom: 2px solid black; }
    .tab-content { display: none; padding: 10px; }
    .tab-content.active { display: block; }
    #timer { font-size: 48px; font-weight: bold; }
    input[type="color"], input[type="range"], input[type="number"], input[type="text"] { margin: 5px 0; width: 100%; }
    #leftPanel { padding: 64px; text-align: left; }
    #leftImage { border-radius: 8px; max-width: 100%; max-height: 100%; object-fit: contain; margin-left: 0; display: block; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    button.customizable-button { padding: 8px 16px; font-size: 16px; border: none; cursor: pointer; }
    body.viewer-mode .container, body.viewer-mode .modal, body.viewer-mode #controlSync { display: none !important; }
    #judgeView { display: none; min-height: 100dvh; background: #101827; color: #fff; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    body.viewer-mode #judgeView { display: flex; }
    #judgeTimer { font-size: clamp(72px, 19vw, 220px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
    #judgeStatus { position: fixed; bottom: 16px; left: 16px; right: 16px; font-size: 14px; opacity: .8; }
    #controlSync { position: fixed; bottom: 12px; right: 12px; z-index: 12; background: #fff; color: #111; padding: 10px; border-radius: 8px; max-width: 300px; box-shadow: 0 1px 8px #0003; font-size: 13px; }
    #controlSync input { width: 100%; margin: 4px 0; }
    #controlSync button { margin: 4px 4px 4px 0; }
  </style>
</head>
<body>
  <div id="judgeView" aria-label="Temporizador para jueces"><div id="judgeTimer" role="timer">02:00</div><div id="judgeStatus" role="status"></div></div>
  <div id="controlSync" hidden>
    <strong>Sincronización</strong>
    <div id="syncStatus" role="status">Configurando…</div>
    <form id="syncLogin" hidden>
      <label for="syncEmail">Correo de control</label><input id="syncEmail" type="email" autocomplete="username" required>
      <label for="syncPassword">Contraseña</label><input id="syncPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Conectar</button>
    </form>
    <button id="syncLogout" type="button" hidden>Cerrar sesión</button>
    <a id="judgeLink" target="_blank" rel="noopener">Abrir vista de jueces</a>
  </div>
  <div class="container">
    <div id="leftPanel" class="panel">
      <img id="leftImage" src="" alt="Código QR del enlace del torneo" style="display:none;">
    </div>
    <div id="rightPanel" class="panel">
      <button class="edit-button customizable-button" onclick="openModal()">Editar</button>
      <input type="file" accept="image/*" id="logoInput" style="display:none;">
      <img id="logo" src="" alt="Logo" style="max-width: 120px; display:none;">
      <div id="timer">02:00</div>
      <div style="margin-top: 20px;">
        <button id="toggleButton" class="customizable-button" onclick="toggleTimer()">Iniciar</button>
        <button id="resetButton" class="customizable-button" onclick="resetTimer()">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="tabs">
        <div class="tab active" onclick="showTab('imagenes')">Subir Imágenes</div>
        <div class="tab" onclick="showTab('fondoIzquierdo')">Fondo Izquierdo</div>
        <div class="tab" onclick="showTab('fondoDerecho')">Fondo Derecho</div>
        <div class="tab" onclick="showTab('textoTiempo')">Texto y Tiempo</div>
        <div class="tab" onclick="showTab('estiloBotones')">Estilo Botones</div>
      </div>

      <div id="imagenes" class="tab-content active">
        <label>Logo:</label>
        <button onclick="document.getElementById('logoInput').click()">Subir Logo</button>
        <label for="qrUrl">Enlace para el código QR:</label>
        <input type="url" id="qrUrl" placeholder="https://playlatam.net/tournaments/..." inputmode="url" autocomplete="url">
        <button type="button" onclick="generateQR()">Generar QR</button>
        <p id="qrStatus" role="status" aria-live="polite"></p>
      </div>

      <div id="fondoIzquierdo" class="tab-content">
        <h4>Fondo Izquierdo</h4>
        <select id="leftBackgroundType" onchange="updateBackgroundOptions('left')">
          <option value="color">Color Sólido</option>
          <option value="gradient">Gradiente</option>
          <option value="image">Imagen</option>
        </select>
        <div id="leftBackgroundOptions"></div>
      </div>

      <div id="fondoDerecho" class="tab-content">
        <h4>Fondo Derecho</h4>
        <select id="rightBackgroundType" onchange="updateBackgroundOptions('right')">
          <option value="color">Color Sólido</option>
          <option value="gradient">Gradiente</option>
          <option value="image">Imagen</option>
        </select>
        <div id="rightBackgroundOptions"></div>
      </div>

      <div id="textoTiempo" class="tab-content">
        <h4>Tiempo</h4>
        <label>Tiempo del Timer (minutos):</label>
        <input type="number" id="timerInput" min="1" step="1" value="2" onchange="updateTimerTime()">

        <h4>Texto</h4>
        <label>Tamaño del Timer:</label>
        <input type="range" id="timerSize" min="20" max="200" oninput="applyTextStyles()">
        <label>Peso Tipográfico:</label>
        <select id="timerWeight" onchange="applyTextStyles()">
          <option value="normal">Normal</option>
          <option value="bold">Bold</option>
          <option value="bolder">Bolder</option>
        </select>
        <label>Color Timer:</label>
        <input type="color" id="timerColor" oninput="applyTextStyles()">
        <label>Color Cuenta Negativa:</label>
        <input type="color" id="negativeColor" oninput="applyTextStyles()">

        
      </div>

      <div id="estiloBotones" class="tab-content">
        <h4>Estilo de los Botones</h4>
        <label>Color de Fondo:</label>
        <input type="color" id="buttonBgColor" oninput="applyButtonStyles()">
        <label>Color del Texto:</label>
        <input type="color" id="buttonTextColor" oninput="applyButtonStyles()">
        <label>Radio de Borde (px):</label>
        <input type="range" id="buttonBorderRadius" min="0" max="50" oninput="applyButtonStyles()">
      </div>

      <br>
      <button onclick="saveSettings()">Guardar</button>
      <button onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <audio id="bipSound" src="" preload="auto"></audio>
  <audio id="alarmSound" src="assets/alarma.mp3" preload="auto"></audio>

'QR8bitByte': function(require, module) {
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

},
'QRBitBuffer': function(require, module) {
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

'QRMath': function(require, module) {
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

'QRPolynomial': function(require, module) {
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;

    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );

        return ( (data << 10) | d) ^ QRUtil.G15_MASK;

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );

        return (data << 12) | d;

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;

        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];

        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

				var totalDataCount = 0;

		this.setupPositionProbePattern(0, this.moduleCount - 7);

			}
			this.modules[6][c] = (c % 2 === 0);

			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;

			if (v < 6) {

			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}

		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;

					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

  <script>
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');

    function showTab(id) {
      tabs.forEach(tab => tab.classList.remove('active'));
      contents.forEach(content => content.classList.remove('active'));
      document.querySelector(`.tab[onclick*="${id}"]`).classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    function openModal() {
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function saveSettings() {
      applyTextStyles();
      applyButtonStyles();

      const logo = document.getElementById('logo');
      const leftImage = document.getElementById('leftImage');

      const imageSettings = {
        logoSrc: logo.src || '',
        leftImageSrc: leftImage.getAttribute('src') || '',
        qrUrl: document.getElementById('qrUrl').value.trim()
      };
      localStorage.setItem('imageSettings', JSON.stringify(imageSettings));

      const leftPanel = document.getElementById('leftPanel');
      const rightPanel = document.getElementById('rightPanel');
      const backgroundSettings = {
        left: leftPanel.style.background,
        right: rightPanel.style.background
      };
      localStorage.setItem('backgroundSettings', JSON.stringify(backgroundSettings));

      const textSettings = {
        size: document.getElementById('timerSize').value,
        weight: document.getElementById('timerWeight').value,
        color: document.getElementById('timerColor').value,
        negativeColor: document.getElementById('negativeColor').value,
        minutes: document.getElementById('timerInput').value
      };
      localStorage.setItem('textSettings', JSON.stringify(textSettings));

      const buttonSettings = {
        bgColor: document.getElementById('buttonBgColor').value,
        textColor: document.getElementById('buttonTextColor').value,
        borderRadius: document.getElementById('buttonBorderRadius').value
      };
      localStorage.setItem('buttonSettings', JSON.stringify(buttonSettings));

      closeModal();
    }

    function loadSettings() {
      const imageSaved = localStorage.getItem('imageSettings');
      if (imageSaved) {
        const images = JSON.parse(imageSaved);
        if (images.logoSrc) {
          const logo = document.getElementById('logo');
          logo.src = images.logoSrc;
          logo.style.display = 'block';
        }
        if (images.qrUrl) {
          document.getElementById('qrUrl').value = images.qrUrl;
          generateQR();
        } else if (images.leftImageSrc) {
          const leftImage = document.getElementById('leftImage');
          leftImage.src = images.leftImageSrc;
          leftImage.style.display = 'block';
        }
      }

      const backgroundSaved = localStorage.getItem('backgroundSettings');
      if (backgroundSaved) {
        const backgrounds = JSON.parse(backgroundSaved);
        if (backgrounds.left) document.getElementById('leftPanel').style.background = backgrounds.left;
        if (backgrounds.right) document.getElementById('rightPanel').style.background = backgrounds.right;
      }

      const textSaved = localStorage.getItem('textSettings');
      if (textSaved) {
        const text = JSON.parse(textSaved);
        document.getElementById('timerSize').value = text.size;
        document.getElementById('timerWeight').value = text.weight;
        document.getElementById('timerColor').value = text.color;
        document.getElementById('negativeColor').value = text.negativeColor;

        updateTimerDisplay();

      if (buttonSaved) {

          <option value="to right">→ Derecha</option>
          <option value="to left">← Izquierda</option>
          <option value="to top">↑ Arriba</option>
          <option value="to bottom">↓ Abajo</option>
          <option value="to top right">↗ Diagonal (arriba derecha)</option>
          <option value="to bottom left">↙ Diagonal (abajo izquierda)</option>
        `;

        const color1 = document.createElement('input');
        color1.type = 'color';
        const color2 = document.createElement('input');
        color2.type = 'color';

        const applyGradient = () => {
          const type = gradientTypeSelect.value;
          const dir = directionSelect.value;
          const c1 = color1.value;
          const c2 = color2.value;
          const panelElement = document.getElementById(panel + 'Panel');

          if (type === 'linear') {
            panelElement.style.background = `linear-gradient(${dir}, ${c1}, ${c2})`;
          } else if (type === 'radial') {
            panelElement.style.background = `radial-gradient(${c1}, ${c2})`;
          }
        };

        [gradientTypeSelect, directionSelect, color1, color2].forEach(el => {
          el.addEventListener('input', applyGradient);
          el.addEventListener('change', applyGradient);
          optionsContainer.appendChild(el);
        });
      } else if (type === 'image') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = (ev) => {
            const panelElement = document.getElementById(panel + 'Panel');
            panelElement.style.backgroundImage = `url(${ev.target.result})`;
            panelElement.style.backgroundSize = 'cover';
            panelElement.style.backgroundPosition = 'center';
          };
          if (file) reader.readAsDataURL(file);
        };
        optionsContainer.appendChild(input);
      }
    }

    function applyTextStyles() {
      const timer = document.getElementById('timer');
      timer.style.fontSize = document.getElementById('timerSize').value + 'px';
      timer.style.fontWeight = document.getElementById('timerWeight').value;
      timer.style.color = document.getElementById('timerColor').value;

    function applyButtonStyles() {
      const buttons = document.querySelectorAll('.customizable-button');
      const bg = document.getElementById('buttonBgColor').value;
      const color = document.getElementById('buttonTextColor').value;
      const radius = document.getElementById('buttonBorderRadius').value + 'px';

        btn.style.backgroundColor = bg;

    let countdown;
    let timeLeft = 120;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function toggleTimer() {
      const button = document.getElementById('toggleButton');
      if (countdown) {
        clearInterval(countdown);
        countdown = null;
        button.textContent = 'Iniciar';
      } else {
        countdown = setInterval(() => {
         timeLeft--;
updateTimerDisplay();

if (timeLeft === 0) {
  document.getElementById('alarmSound').play();
}

if (timeLeft < 0) {
  document.getElementById('timer').style.color = document.getElementById('negativeColor').value;
} else if (timeLeft <= 10) {
  document.getElementById('bipSound').play();
  // No cambiar el color aún, solo bip.
}

        }, 1000);
        button.textContent = 'Pausar';
      }
    }

    function updateTimerTime() {
      const input = document.getElementById('timerInput');
      if (!Number.isInteger(Number(input.value)) || Number(input.value) < 1) return;
      resetTimer();
    }

    function resetTimer() {
      clearInterval(countdown);
      countdown = null;
      const input = document.getElementById('timerInput');
      timeLeft = parseInt(input.value) * 60;
      updateTimerDisplay();
      applyTextStyles();
      document.getElementById('toggleButton').textContent = 'Iniciar';
    }

    function updateTimerDisplay() {
    const absTime = Math.abs(timeLeft);
    const minutes = Math.floor(absTime / 60).toString().padStart(2, '0');
    const seconds = (absTime % 60).toString().padStart(2, '0');
    const prefix = timeLeft < 0 ? '-' : '';
    document.getElementById('timer').textContent = `${prefix}${minutes}:${seconds}`;
    }


    document.getElementById('logoInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const logo = document.getElementById('logo');
          logo.src = e.target.result;
          logo.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    function generateQR() {
      const input = document.getElementById('qrUrl');
      const status = document.getElementById('qrStatus');
      const image = document.getElementById('leftImage');
      const raw = input.value.trim();
      if (!raw) {
        image.removeAttribute('src');
        image.style.display = 'none';
        status.textContent = 'Ingresa un enlace para generar el código QR.';
        return false;
      }
      let url;
      try {
        url = new URL(raw);
        if (!['http:', 'https:'].includes(url.protocol)) throw new Error('Protocolo inválido');
      } catch (error) {
        status.textContent = 'Ingresa un enlace válido que comience con https:// o http://.';
        return false;
      }
      try {
        // The QR engine expects one byte per character; URLs are normalized to ASCII.
        const bytes = new TextEncoder().encode(url.href);
        const data = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
        const qr = new LocalQRCode(0, 0); // 0 = error correction M
        qr.addData(data);
        qr.make();
        const count = qr.getModuleCount();
        const quietZone = 4;
        const cell = Math.max(6, Math.floor(720 / (count + quietZone * 2)));
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = (count + quietZone * 2) * cell;
        const context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = '#000000';
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) {
              context.fillRect((col + quietZone) * cell, (row + quietZone) * cell, cell, cell);
            }
          }
        }
        image.src = canvas.toDataURL('image/png');
        image.style.display = 'block';
        status.textContent = 'Código QR generado. Presiona Guardar para conservar el enlace.';
        return true;
      } catch (error) {
        status.textContent = 'No fue posible generar el QR. Prueba con un enlace más corto.';
        return false;
      }
    }

    document.getElementById('qrUrl').addEventListener('change', generateQR);

    window.onload = () => {
      updateTimerDisplay();
      loadSettings();
    };
  </script>

    // Use a stable, private ID for this event/screen; the same page URL is shared with judges.

    let currentState = null;

    let writeState;
    let signIn;
    let signOutUser;
    let lastSecond = null;

    function formatTime(seconds) {
      const abs = Math.abs(seconds);
      const sign = seconds < 0 ? '-' : '';
      return sign + String(Math.floor(abs / 60)).padStart(2, '0') + ':' + String(abs % 60).padStart(2, '0');
    }
    function remainingMs() {
      if (!currentState) return null;
      return currentState.running
        ? currentState.remainingMs - (Date.now() + serverOffset - currentState.startedAt)
        : currentState.remainingMs;
    }
    function renderLive() {
      const ms = remainingMs();
      if (ms === null) return;
      const seconds = Math.ceil(ms / 1000);
      const text = formatTime(seconds);
      document.getElementById('judgeTimer').textContent = text;
      if (!isJudge) {
        document.getElementById('timer').textContent = text;
        document.getElementById('timer').style.color = seconds < 0
          ? document.getElementById('negativeColor').value
          : document.getElementById('timerColor').value;
        document.getElementById('toggleButton').textContent = currentState.running ? 'Pausar' : 'Iniciar';
        if (lastSecond !== null && lastSecond > 0 && seconds <= 0) {
          document.getElementById('alarmSound').play().catch(() => {});
        }
      }
      document.getElementById('judgeTimer').style.color = seconds < 0 ? '#ff6262' : '#fff';
      lastSecond = seconds;
    }
    const configured = Object.values(firebaseConfig).every(Boolean);
    if (!configured) {
      if (isJudge) judgeStatus.textContent = 'La sincronización aún no está configurada.';
      else {
        controlSync.hidden = false;
        syncStatus.textContent = 'Modo local. Falta la dirección de Realtime Database (databaseURL).';
      }
    } else {
      if (!isJudge) {
        controlSync.hidden = false;
        syncStatus.textContent = 'Conectando…';
      } else judgeStatus.textContent = 'Conectando…';
      try {
        const base = 'https://www.gstatic.com/firebasejs/12.19.0/';
        const [{ initializeApp }, dbModule, authModule] = await Promise.all([
          import(base + 'firebase-app.js'),
          import(base + 'firebase-database.js'),
          isJudge ? Promise.resolve(null) : import(base + 'firebase-auth.js')
        ]);
        const app = initializeApp(firebaseConfig);
        const db = dbModule.getDatabase(app);
        const stateRef = dbModule.ref(db, 'timers/' + roomId);
        dbModule.onValue(dbModule.ref(db, '.info/serverTimeOffset'), snap => {
          serverOffset = snap.val() || 0;
        });
        dbModule.onValue(stateRef, snap => {
          currentState = snap.val();
          lastSecond = null;
          if (currentState) {
            renderLive();
            if (isJudge) judgeStatus.textContent = 'Sincronizado';
            else syncStatus.textContent = canControl ? 'Control conectado' : 'Solo lectura. Inicia sesión para controlar.';
          } else if (isJudge) judgeStatus.textContent = 'Esperando al temporizador…';
          else syncStatus.textContent = 'Sin conteo publicado. Inicia sesión para comenzar.';
        }, () => {
          if (isJudge) judgeStatus.textContent = 'No se pudo acceder al conteo.';
          else syncStatus.textContent = 'No se pudo acceder al conteo.';
        });
        setInterval(renderLive, 200);
        if (!isJudge) {
          const auth = authModule.getAuth(app);
          authModule.onAuthStateChanged(auth, user => {
            canControl = !!user;
            loginForm.hidden = !!user;
            logoutButton.hidden = !user;
            syncStatus.textContent = user ? 'Control conectado' : 'Solo lectura. Inicia sesión para controlar.';
          });
          signIn = (email, password) => authModule.signInWithEmailAndPassword(auth, email, password);
          signOutUser = () => authModule.signOut(auth);
          writeState = state => dbModule.set(stateRef, state);
          const originalToggle = window.toggleTimer;
          const originalReset = window.resetTimer;
          const originalDuration = window.updateTimerTime;
          const publish = async state => {
            if (!canControl) { syncStatus.textContent = 'Inicia sesión para controlar el timer.'; return; }
            try { await writeState(state); }
            catch (error) { syncStatus.textContent = 'No se pudo guardar. Revisa los permisos de Firebase.'; }
          };
          window.toggleTimer = () => {
            if (!canControl) { syncStatus.textContent = 'Inicia sesión para controlar el timer.'; return; }
            const fallback = Math.max(1, Number(document.getElementById('timerInput').value) || 2) * 60000;
            const ms = currentState ? remainingMs() : fallback;
            publish({ running: !currentState?.running, remainingMs: ms,
              startedAt: Date.now() + serverOffset });
          };
          window.resetTimer = () => {
            const minutes = Number(document.getElementById('timerInput').value);
            if (!Number.isInteger(minutes) || minutes < 1) return;
            publish({ running: false, remainingMs: minutes * 60000, startedAt: 0 });
          };
          window.updateTimerTime = window.resetTimer;
          loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            try { await signIn(document.getElementById('syncEmail').value,
              document.getElementById('syncPassword').value); loginForm.reset(); }
            catch (error) { syncStatus.textContent = 'No se pudo iniciar sesión. Revisa las credenciales.'; }
          });
          logoutButton.addEventListener('click', () => signOutUser());
        }
      } catch (error) {
        if (isJudge) judgeStatus.textContent = 'No se pudo conectar al servicio.';
        else syncStatus.textContent = 'No se pudo conectar al servicio.';
      }
    }
